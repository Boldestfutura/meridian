  # Spotify playlists Cameron has started anywhere (phone, desktop, Sonos),
  # newest first, for the tablet's playlist order. HA's Spotify integration
  # can only name playlists the API will return: ones Spotify made (Daily
  # Mix, Discover Weekly, This Is ...) never appear; DJ does.
  - trigger:
      - trigger: state
        entity_id: media_player.spotify_cameron
        attribute: media_playlist
      - trigger: event
        event_type: tablet_playlists_refresh
    condition:
      - condition: template
        value_template: >-
          {{ state_attr('media_player.spotify_cameron', 'media_playlist') not in [none, ''] }}
    sensor:
      - name: Spotify Recent Playlists
        unique_id: spotify_recent_playlists
        icon: mdi:history
        state: "{{ state_attr('media_player.spotify_cameron', 'media_playlist') }}"
        attributes:
          names: >-
            {% set new = state_attr('media_player.spotify_cameron', 'media_playlist') %}
            {% set old = this.attributes.names | default([]) %}
            {{ ([new] + (old | reject('eq', new) | list))[:30] }}
  # Playlists for the tablet's Media tab. Music Assistant's library, the
  # ones last started in Spotify first, then MA's most recently played,
  # minus MA's own generated mixes and the Plex
  # playlists (by name - get_library returns no source). State is the count,
  # which the tablet's eight playlist slots use to hide the empty ones.
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/30"
      - trigger: event
        event_type: tablet_playlists_refresh
      - trigger: state
        entity_id: sensor.spotify_recent_playlists
    action:
      - action: music_assistant.get_library
        data:
          config_entry_id: <your music_assistant config entry id>
          media_type: playlist
          order_by: last_played_desc
          limit: 100
        response_variable: lib
      - variables:
          generated:
            - "500 Random tracks (from library)"
            - "All favorited tracks"
            - "Infinite Mix (favorites)"
            - "Infinite Mix (library)"
            - "Random Album (from library)"
            - "Random Artist (from library)"
            - "Recently added tracks"
            - "Recently played tracks"
            # Plex playlists - this house wants Spotify only on the tablet
            - "All Music"
            - "Fresh ❤️"
            - "Noah Kahan"
            - "Recently Added"
            - "Recently Played"
            - "❤️ Tracks"
          picked: >-
            {% set recent = state_attr('sensor.spotify_recent_playlists', 'names') or [] %}
            {% set items = lib['items'] | rejectattr('name', 'in', generated) | list %}
            {% set ns = namespace(out=[]) %}
            {% for n in recent %}
              {% for i in items if i.name == n %}
                {% set ns.out = ns.out + [{'name': i.name, 'uri': i.uri, 'image': i.image or ''}] %}
              {% endfor %}
            {% endfor %}
            {% for i in items if i.name not in recent %}
              {% set ns.out = ns.out + [{'name': i.name, 'uri': i.uri, 'image': i.image or ''}] %}
            {% endfor %}
            {{ ns.out[:8] }}
    sensor:
      - name: Tablet Playlists
        unique_id: tablet_playlists
        icon: mdi:playlist-music
        state: "{{ picked | count }}"
        attributes:
          items: "{{ picked }}"
