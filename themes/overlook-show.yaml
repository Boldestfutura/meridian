# Overlook Show — the Show card's look (www/overlook-show.js) as an HA theme, for
# button-card / Bubble Card dashboards. Used per view (theme: Overlook Show) on the
# ha-phone-showlook test dashboard; the app-wide theme stays Overlook.
#
# The values are the Show card's own tokens: a blue-grey gradient ground, frosted cards
# with a white edge and a soft blue shadow, navy ink, a blue accent, warm orange for lit
# lights. Both modes are declared (a theme with only modes.dark is forced dark).
Overlook Show:
  # --- shape --------------------------------------------------------------
  ha-card-border-radius: "26px"
  ha-card-border-width: "1px"
  button-card-border-radius: "20px"
  bubble-border-radius: "26px"
  mush-border-radius: "20px"
  mush-icon-border-radius: "50%"

  # --- type ---------------------------------------------------------------
  primary-font-family: "Figtree, system-ui, -apple-system, sans-serif"
  paper-font-common-base_-_font-family: "Figtree, system-ui, sans-serif"
  paper-font-body1_-_font-family: "Figtree, system-ui, sans-serif"

  # --- accent: the Show's blue; lit lights are its warm orange --------------
  primary-color: "#1d5cf0"
  accent-color: "#1d5cf0"
  rgb-primary-color: "29, 92, 240"
  rgb-accent-color: "29, 92, 240"
  state-icon-active-color: "#f39a43"
  paper-item-icon-active-color: "#f39a43"
  state-light-active-color: "#f39a43"
  switch-checked-button-color: "#1d5cf0"
  switch-checked-track-color: "#1d5cf0"
  input-hover-line-color: "#1d5cf0"
  # HA 2026 buttons, toggles and tabs read this scale; 40 carries white text
  ha-color-primary-05: "#000f2e"
  ha-color-primary-10: "#001847"
  ha-color-primary-20: "#002a75"
  ha-color-primary-30: "#0a3fa6"
  ha-color-primary-40: "#1d5cf0"
  ha-color-primary-50: "#3d74f5"
  ha-color-primary-60: "#6b9bff"
  ha-color-primary-70: "#93b6ff"
  ha-color-primary-80: "#bcd1ff"
  ha-color-primary-90: "#dfe8ff"
  ha-color-primary-95: "#eff4ff"

  modes:
    light:
      lovelace-background: "linear-gradient(165deg, #f4f7fd 0%, #e4ecf9 100%) fixed"
      primary-background-color: "#eef3fb"
      secondary-background-color: "#e4ecf9"
      card-background-color: "rgba(255, 255, 255, 0.78)"
      ha-card-background: "rgba(255, 255, 255, 0.78)"
      ha-card-border-color: "rgba(255, 255, 255, 0.95)"
      ha-card-box-shadow: "0 1px 2px rgba(22, 42, 84, 0.04), 0 10px 30px rgba(22, 42, 84, 0.07)"
      bubble-pop-up-background-color: "rgba(255, 255, 255, 0.94)"
      ha-dialog-surface-background: "#ffffff"
      mdc-theme-surface: "#ffffff"
      divider-color: "rgba(22, 42, 84, 0.08)"
      primary-text-color: "#142038"
      secondary-text-color: "#6c7891"
      text-primary-color: "#ffffff"
      disabled-text-color: "rgba(20, 32, 56, 0.38)"
      state-icon-color: "#6c7891"
      paper-item-icon-color: "#6c7891"
      ha-card-header-color: "#142038"
      input-fill-color: "#eef3fb"
      mdc-text-field-fill-color: "#eef3fb"
      mdc-select-fill-color: "#eef3fb"
      switch-unchecked-button-color: "#ffffff"
      switch-unchecked-track-color: "#b9c6db"
    dark:
      lovelace-background: "linear-gradient(165deg, #0b0f18 0%, #121827 100%) fixed"
      primary-background-color: "#0b0f18"
      secondary-background-color: "#121827"
      card-background-color: "rgba(29, 35, 50, 0.82)"
      ha-card-background: "rgba(29, 35, 50, 0.82)"
      ha-card-border-color: "rgba(255, 255, 255, 0.05)"
      ha-card-box-shadow: "0 10px 30px rgba(0, 0, 0, 0.25)"
      bubble-pop-up-background-color: "rgba(24, 29, 42, 0.96)"
      ha-dialog-surface-background: "#181d2a"
      mdc-theme-surface: "#181d2a"
      divider-color: "rgba(255, 255, 255, 0.08)"
      primary-text-color: "#eef2fb"
      secondary-text-color: "#8e99b0"
      text-primary-color: "#ffffff"
      disabled-text-color: "rgba(238, 242, 251, 0.38)"
      state-icon-color: "#8e99b0"
      paper-item-icon-color: "#8e99b0"
      ha-card-header-color: "#eef2fb"
      primary-color: "#6b9bff"
      accent-color: "#6b9bff"
      rgb-primary-color: "107, 155, 255"
      input-fill-color: "rgba(255, 255, 255, 0.05)"
      mdc-text-field-fill-color: "rgba(255, 255, 255, 0.05)"
      mdc-select-fill-color: "rgba(255, 255, 255, 0.05)"
      switch-unchecked-button-color: "#8e99b0"
      switch-unchecked-track-color: "rgba(255, 255, 255, 0.22)"
